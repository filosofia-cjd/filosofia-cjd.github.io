<title>Manuscrito Perdido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{
  --bg:#FFFFFF; --nav:rgba(255,255,255,.82); --card:#FFFFFF; --card2:#FBFBFD;
  --fill:#F5F5F7; --fill2:#FAFAFC;
  --sep:rgba(0,0,0,.08); --line:rgba(0,0,0,.08);
  --sombra:0 1px 2px rgba(0,0,0,.035), 0 8px 22px rgba(0,0,0,.04);
  --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#B0B0B6;
  --blue:#0071E3; --green:#1D9E52; --red:#D7263D; --orange:#B8700C;
  --fa:#0071E3; --fb:#7D4FD3; --fc:#0E8A8A; --fd:#B8700C;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --m:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
html{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{scroll-padding-top:78px}
body{background:var(--bg);color:var(--fg);font:400 17px/1.47 var(--f);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:860px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

/* barra superior */
.nav{position:sticky;top:0;z-index:20;margin:0;padding:11px 16px 10px;
  background:var(--bg);border-bottom:1px solid var(--sep)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .nav{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)} }
.nav .t{font:600 17px/1.2 var(--f);letter-spacing:-.01em;text-align:center;margin:0}
.nav .s{font:400 13px/1.2 var(--f);color:var(--fg2);text-align:center;margin:2px 0 0}
.bar{position:absolute;left:0;bottom:0;height:2px;background:var(--blue);width:0;transition:width 1s linear;border-radius:0 2px 2px 0}
.bar.urg{background:var(--red)}

h1{font:700 34px/1.12 var(--f);letter-spacing:-.022em;margin:24px 0 6px;text-wrap:balance}
.sub{color:var(--fg2);font-size:15px;margin:0 0 20px;max-width:62ch}
.hdr{font:600 13px/1 var(--f);letter-spacing:.01em;color:var(--fg2);margin:26px 4px 7px}

/* superfícies */
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra);
  border-radius:16px;padding:18px;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font:600 13px/1 var(--f);color:var(--fg2);margin:0 0 6px 2px}
input,select,textarea{appearance:none;-webkit-appearance:none;width:100%;background:var(--fill);
  border:1px solid transparent;border-radius:10px;color:var(--fg);font:400 17px/1.3 var(--f);
  padding:13px 14px;font-family:var(--f)}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--blue);outline:none}
textarea{font-family:var(--m);font-size:16px;letter-spacing:.06em;resize:vertical;line-height:1.7}
select{background-image:none}
input::placeholder,textarea::placeholder{color:var(--fg3)}
:focus-visible{outline:3px solid rgba(0,113,227,.35);outline-offset:1px}

.btn{appearance:none;border:1px solid transparent;width:100%;background:var(--fill);color:var(--blue);
  font:600 17px/1 var(--f);padding:15px 18px;border-radius:12px;cursor:pointer;
  transition:transform .12s ease,background .12s ease,opacity .12s ease}
.btn:hover{background:#EDEDF0}
.btn:active{transform:scale(.975);opacity:.8}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#0063C8}
.btn.quiet{background:transparent;padding:13px 0}
.btn.quiet:hover{background:transparent;text-decoration:underline}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{width:auto;flex:1 1 130px}

/* estatísticas */
.hud{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin:16px 0 14px}
.hud div{flex:1 1 0;min-width:0;padding:12px 8px;text-align:center;border-left:1px solid var(--sep)}
.hud div:first-child{border-left:0}
.hud>div>span{display:block;font:500 11px/1 var(--f);color:var(--fg2);margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud b{display:block;font:600 19px/1.1 var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.hud.urgente b#rel{color:var(--red)}

/* famílias */
.fams{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;
  scrollbar-width:none;-ms-overflow-style:none}
.fams::-webkit-scrollbar{display:none}
.fam{flex:0 0 auto;border-radius:99px;padding:6px 13px;font:600 13px/1 var(--f);
  color:var(--fg2);background:var(--card);border:1px solid var(--line)}
.fam.on{background:var(--green);color:#fff;border-color:transparent}

/* grelha de cartões */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.cb{text-align:left;background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra);
  border-radius:18px;padding:15px;cursor:pointer;
  color:var(--fg);font-family:var(--f);display:flex;flex-direction:column;gap:7px;min-width:0;
  transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease}
.cb:hover{box-shadow:0 2px 4px rgba(0,0,0,.05), 0 12px 28px rgba(0,0,0,.07)}
.cb:active{transform:scale(.97)}
.cb .f{font:600 12px/1 var(--f);letter-spacing:.02em;color:var(--fam)}
.cb h4{font:600 16px/1.25 var(--f);letter-spacing:-.01em;margin:0;flex:1}
.cb .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:99px;background:var(--fam);display:block}
.pts{font:600 13px/1 var(--m);font-variant-numeric:tabular-nums;color:var(--fg2)}
.cb.done{opacity:.5;box-shadow:none}
.cb.done .pts{color:var(--green)}

/* painel do cartão */
.panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra);
  border-radius:18px;padding:20px;margin-top:14px}
.panel .k{font:600 12px/1 var(--f);letter-spacing:.02em}
.panel h3{font:700 22px/1.2 var(--f);letter-spacing:-.018em;margin:7px 0 2px}
.panel .who{font-size:13px;color:var(--fg2);margin:0 0 14px}
.panel p{margin:0 0 12px;font-size:16px}
.panel ol{margin:0 0 14px;padding-left:0;list-style:none;counter-reset:n}
.panel li{counter-increment:n;position:relative;padding:10px 0 10px 32px;font-size:16px;
  border-top:1px solid var(--sep)}
.panel li:first-child{border-top:0;padding-top:2px}
.panel li::before{content:counter(n);position:absolute;left:0;top:10px;width:22px;height:22px;
  border-radius:99px;background:var(--fill);color:var(--fg2);font:600 12px/22px var(--m);text-align:center}
.panel li:first-child::before{top:2px}
.fml{display:block;font:600 21px/1.4 var(--m);color:var(--fg);background:var(--fill);
  border:1px solid var(--line);border-radius:12px;padding:16px;margin:4px 0 16px;
  word-break:break-word;text-align:center}
.quote{color:var(--fg2);border-left:3px solid var(--sep);padding-left:12px}
.ansrow{display:flex;gap:10px;align-items:stretch}
.ansrow input{flex:0 0 86px;font:600 20px/1 var(--m);text-align:center;padding:14px 6px}
.ansrow .btn{flex:1 1 auto;width:auto}
.msg{margin:12px 0 0;font-size:15px;min-height:1.2em}
.msg.ok{color:var(--green)} .msg.bad{color:var(--red)} .msg.warn{color:var(--orange)}

/* fim */
.fim{background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra);
  border-radius:20px;padding:32px 20px;text-align:center;margin-top:18px}
.fim .k{font:600 13px/1 var(--f);color:var(--fg2)}
.codigo{font:700 clamp(30px,10vw,44px)/1.1 var(--m);letter-spacing:.14em;margin:16px 0 10px;
  word-break:break-all;color:var(--blue)}

/* tabela */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:12px;border-top:1px solid var(--sep)}
thead th{border-top:0;font:600 12px/1 var(--f);color:var(--fg2);letter-spacing:.02em;background:var(--fill2)}
td.num{font-family:var(--m);font-variant-numeric:tabular-nums}
tr.podio td{background:var(--fill2)}
.pos{display:inline-block;min-width:24px;height:24px;border-radius:99px;background:var(--fill);
  font:600 12px/24px var(--m);text-align:center;padding:0 6px}
tr.podio .pos{background:var(--blue);color:#fff}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--sep);color:var(--fg3);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- cartões interativos (telemóvel) ---- */
.opts{display:flex;flex-direction:column;gap:9px;margin:4px 0 14px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  font:400 16px/1.4 var(--f);color:var(--fg);cursor:pointer;
  transition:transform .1s ease,border-color .1s ease,background .1s ease}
.opt:active{transform:scale(.985)}
.opt .b{flex:0 0 auto;width:24px;height:24px;border-radius:99px;background:var(--fill);
  border:1px solid var(--line);font:600 12px/22px var(--m);text-align:center;color:var(--fg2)}
.opt.sel{border-color:var(--blue);background:#F2F8FF}
.opt.sel .b{background:var(--blue);border-color:var(--blue);color:#fff}

.itens{display:flex;flex-direction:column;gap:9px;margin:4px 0 12px}
.item{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  font:400 16px/1.4 var(--f);color:var(--fg);cursor:pointer;transition:transform .1s ease}
.item:active{transform:scale(.985)}
.item .m{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--fill);
  border:1px solid var(--line);font:700 15px/28px var(--f);text-align:center;color:var(--fg3)}
.item.sim{border-color:var(--green)} .item.sim .m{background:var(--green);border-color:var(--green);color:#fff}
.item.nao{border-color:var(--fg3)} .item.nao .m{background:var(--fg3);border-color:var(--fg3);color:#fff}
.tally{font:600 15px/1 var(--f);color:var(--fg2);margin:0 0 14px;text-align:center}
.tally b{color:var(--fg);font-family:var(--m);font-size:18px}

.tt{width:100%;border-collapse:collapse;margin:4px 0 12px;font-family:var(--m)}
.tt th,.tt td{border:1px solid var(--line);padding:0;text-align:center;font-size:15px}
.tt th{background:var(--fill2);font:600 13px/2.2 var(--f);color:var(--fg2)}
.tt td{height:42px}
.tt td:last-child{width:38px}
.tt .rm{color:var(--fg3);font:400 15px/1 var(--f)}
.tt td.fix{color:var(--fg2);background:var(--fill2)}
.tt button{width:100%;height:42px;border:0;background:transparent;font:700 16px/1 var(--m);
  color:var(--fg3);cursor:pointer}
.tt button.v{background:var(--green);color:#fff} .tt button.f{background:var(--fill);color:var(--fg2)}

.salas{display:flex;flex-direction:column;gap:9px;margin:4px 0 12px}
.sala{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.sala h5{font:600 13px/1 var(--f);color:var(--fg2);margin:0 0 8px}
.sala .tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sala select{font-size:14px;padding:9px 6px;border-radius:9px}

.escolhe{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.escolhe button{flex:1 1 56px;min-width:56px;background:var(--fill);border:1px solid transparent;
  border-radius:12px;padding:14px 4px;font:700 19px/1 var(--m);color:var(--fg);cursor:pointer}
.escolhe button.on{background:var(--blue);border-color:var(--blue);color:#fff}

.barra{position:sticky;bottom:0;z-index:15;margin:14px -18px -20px;padding:12px 18px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--card);border-top:1px solid var(--sep);
  border-radius:0 0 17px 17px;display:flex;gap:10px;align-items:center}
.barra .btn{margin:0}
.barra .lbl{flex:1 1 auto;min-width:0;font:500 14px/1.3 var(--f);color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .lbl b{color:var(--fg);font:700 17px/1 var(--m);font-variant-numeric:tabular-nums}
.passo{font:600 12px/1 var(--f);color:var(--fg2);margin:0 0 8px}

/* ---- tabela por conectivas ---- */
.ttwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px -4px 12px;padding:0 4px}
.tt2{border-collapse:separate;border-spacing:0;font-family:var(--m);white-space:nowrap}
.tt2 th,.tt2 td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
.tt2 thead th{border-top:1px solid var(--line);background:var(--fill2);
  font:600 14px/34px var(--m);color:var(--fg2);height:34px}
.tt2 th:first-child,.tt2 td:first-child{border-left:1px solid var(--line)}
.tt2 .fx{position:sticky;left:0;z-index:2;background:var(--card);width:30px;min-width:30px}
.tt2 thead .fx{background:var(--fill2)}
.tt2 .fx:nth-child(2){left:30px} .tt2 .fx:nth-child(3){left:60px}
.tt2 .par{width:12px;min-width:12px;color:var(--fg3);border-right:0;background:transparent}
.tt2 .var{width:26px;min-width:26px;color:var(--fg3);font-size:14px;background:var(--fill2)}
.tt2 .op{width:34px;min-width:34px}
.tt2 thead .op.prin{color:var(--blue);background:#EAF3FF}
.tt2 td.op.prin{background:#F6FAFF}
.tt2 .fx2{width:34px;min-width:34px;border-right:0}
.tt2 td button{width:100%;height:38px;border:0;background:transparent;
  font:700 15px/1 var(--m);color:var(--fg3);cursor:pointer}
.tt2 td button.v{background:var(--green);color:#fff}
.tt2 td button.f{background:var(--fill);color:var(--fg2)}
.tt2 .rm{color:var(--fg3)!important;font:400 14px/1 var(--f)!important}
</style>

ão de areia até pode ser um monte.","Nenhuma: o erro está na passagem para a conclusão.","A segunda: juntar um grão muda sempre o peso do conjunto.","A segunda: «monte» é vago e não há um grão exato que marque a fronteira, por isso é falso que juntar um grão nunca faça diferença."],"resp":4}]},{"cod":"D4","pts":50,"t":"A caverna","cen":"Os prisioneiros estão acorrentados desde que nasceram, virados para a parede, e só veem sombras projetadas.","passos":[{"q":"Podiam descobrir sozinhos que o que viam eram apenas sombras?","ops":["Sim: bastava observarem com mais atenção e durante mais tempo.","Não: só tinham sombras, e não havia nada com que as comparar.","Sim, se algum deles fosse suficientemente inteligente.","Não, porque as correntes impediam-nos de pensar."],"resp":2},{"q":"Então o que é que era preciso para a situação mudar?","ops":["Mais luz dentro da caverna.","Que as sombras desaparecessem.","Um ponto de vista vindo de fora — alguém que os obrigasse a sair e a ver os originais.","Uma linguagem melhor para descrever as sombras."],"resp":3}]}]},"a11":{"ano":11,"enun":[["O Tejo atravessa Lisboa.",1],["Fecha a janela, se fazes favor.",0],["Será que a alma é imortal?",0],["Nenhum número primo é par.",1],["Que belo argumento!",0],["Oxalá o teste corra bem.",0],["Platão foi discípulo de Sócrates.",1],["Pensa pela tua própria cabeça.",0],["A Lua é feita de queijo.",1],["Traz-me o livro amanhã.",0],["Todos os quadrados têm quatro lados.",1],["Quem escreveu a República?",0],["Está um frio de rachar!",0],["Sócrates nasceu em Atenas.",1],["Não faças aos outros o que não queres que te façam.",0],["Existem números primos maiores do que mil.",1],["A água ferve a 100 °C ao nível do mar.",1],["Que horas são?",0],["Oxalá nunca mais chova.",0],["Lisboa fica a norte do Porto.",1],["Senta-te e ouve com atenção.",0],["O número sete é ímpar.",1],["Espero que venhas amanhã.",0],["Aristóteles foi aluno de Platão.",1],["Como é que isso aconteceu?!",0],["Nenhum ser humano vive mil anos /* ---------- utilitários ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(arr,n,r){const c=arr.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(r()*c.length),1)[0]);return o;}
function semente(ano,eq,cod){let h=2166136261>>>0;const s=ano+"|"+eq+"|"+cod+"|"+SAL;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function hash10(n){let h=2166136261>>>0;const s=String(n)+SAL;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h%1024;}
function fazCodigo(ano,eq,pts,cart,mins){
  const p=Math.min(88,Math.round(pts/5)), c=Math.min(16,cart), mi=Math.min(63,mins), a=(ano===11?1:0);
  const carga=(((((eq*89+p)*17+c)*64+mi)*2)+a);
  const v=carga*1024+hash10(carga);
  let s="",x=v; for(let i=0;i<7;i++){ s=ALFA[x%32]+s; x=Math.floor(x/32); }
  return s;
}

      itens:s.map(x=>x[0]),resp:s.filter(x=>x[1]).length,
      dica:"Um argumento é válido pela forma. Perguntem: se as premissas fossem todas verdadeiras, a conclusão podia ainda assim ser falsa?"};});

      ops:cor.map((c,i)=>"Caixa "+(i+1)+" — "+c),resp:v.sol,

 "Imbatíveis","Famintos","Destemidos","Rigorosos","Irónicos","Lendários","Incansáveis","Matinais"];
const SEG_NOME = 30;
function nomeDe(eq,k){ return "Os "+SUBST[(eq-1)%SUBST.length]+" "+ADJ[((k%ADJ.length)+ADJ.length)%ADJ.length]; }

function entrada(){
  nav.hidden=true;
  app.innerHTML=
   '<h1>O Manuscrito Perdido da Academia</h1>'+
   '<p class="sub">A vossa equipa tem um conjunto de enunciados só vosso. Copiar da mesa do lado não serve de nada.</p>'+
   '<div class="card">'+
   '<div class="field"><label for="ano">Ano</label>'+
   '<select id="ano"><option value="10">10.º ano</option><option value="11">11.º ano</option></select></div>'+
   '<div class="field" style="margin-bottom:18px"><label for="eq">Número da equipa, o que está na vossa mesa</label>'+
   '<input id="eq" inputmode="numeric" maxlength="2" placeholder="7"></div>'+
   '<button class="btn primary" id="go">Continuar</button>'+
   '<p class="msg" id="m"></p></div>';
  document.getElementById("go").onclick=()=>{
    const eq=parseInt(document.getElementById("eq").value,10);
    const ano=parseInt(document.getElementById("ano").value,10);
    const m=document.getElementById("m");
    if(!(eq>=1&&eq<=63)){ m.className="msg bad"; m.textContent="O número da equipa tem de estar entre 1 e 63."; return; }
    escolheNome(ano,eq);
  };
}

function escolheNome(ano,eq){
  let k=Math.floor(Math.random()*ADJ.length);
  const ate=Date.now()+SEG_NOME*1000;
  nav.hidden=true;
  app.innerHTML=
   '<h1>O vosso nome</h1>'+
   '<p class="sub">O nome é sorteado. Têm '+SEG_NOME+' segundos para trocar as vezes que quiserem; '+
   'quando o tempo acabar, fica o que estiver no ecrã.</p>'+
   '<div class="fim" style="padding:28px 20px"><span class="k">Equipa '+eq+' · '+ano+'.º ano</span>'+
   '<p id="nomeq" style="font:700 clamp(24px,7vw,34px)/1.15 var(--f);letter-spacing:-.02em;margin:14px 0 0"></p></div>'+
   '<div class="card" style="margin-top:12px">'+
   '<button class="btn" id="outro">Gerar outro nome</button>'+
   '<p class="msg" id="conta" style="text-align:center"></p>'+
   '<button class="btn primary" id="vai" style="margin-top:6px">Começar</button></div>'+
   '<p class="sub" style="margin:14px 2px 0;font-size:14px">Carreguem em Começar só quando o professor disser. O cronómetro arranca nesse momento.</p>';
  const el=document.getElementById("nomeq"), bo=document.getElementById("outro"), cc=document.getElementById("conta");
  const pinta=()=>{ el.textContent=nomeDe(eq,k); };
  pinta();
  bo.onclick=()=>{ let n=k; while(n===k) n=Math.floor(Math.random()*ADJ.length); k=n; pinta(); };
  const t=setInterval(()=>{
    const s=Math.max(0,Math.ceil((ate-Date.now())/1000));
    if(s>0){ cc.className="msg"; cc.textContent=s+(s===1?" segundo":" segundos")+" para trocar"; }
    else { clearInterval(t); bo.remove();
      cc.className="msg ok"; cc.textContent="O nome está fixo."; }
  },250);
  const arranca2=()=>{
    clearInterval(t);
    ST={ano:ano,eq:eq,nm:nomeDe(eq,k),ini:Date.now(),pts:0,feitos:{},err:{},
        pistas:0,saidas:0,ult:"",passo:{},fim:null};
    guarda(); jogo(); envia(true,false);
  };
  document.getElementById("vai").onclick=function(){
    const vb=this;
    if(!SYNC.url){ arranca2(); return; }
    vb.disabled=true; vb.textContent="A verificar a mesa…";
    const u=SYNC.url.replace(/\/+$/,"")+"/"+SYNC.sessao+"/"+ano+"/"+eq+".json";
    const segue=()=>{ vb.disabled=false; vb.textContent="Começar"; arranca2(); };
    fetch(u,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
      if(j && j.ts && (Date.now()-j.ts)<5400000 && j.nm && j.nm!==nomeDe(eq,k)){
        vb.disabled=false; vb.textContent="Começar";
        const cx=document.createElement("div"); cx.className="card";
        cx.style.borderColor="var(--red)";
        cx.innerHTML='<p style="margin:0 0 8px"><b>Esperem.</b> A mesa '+eq+' já está a ser usada por outra equipa, '+
          'a «'+esc(j.nm)+'».</p><p style="margin:0 0 14px;color:var(--fg2);font-size:15px">'+
          'Confirmem o número que está na vossa mesa. Se começarem assim, as duas equipas misturam-se e perdem os pontos uma da outra. '+
          'Em caso de dúvida, chamem o professor.</p>'+
          '<button class="btn" id="corrige">Corrigir o número da mesa</button>'+
          '<button class="btn quiet" id="forca" style="margin-top:4px">O número está certo, continuar</button>';
        vb.parentNode.parentNode.insertBefore(cx,vb.parentNode.nextSibling);
        cx.scrollIntoView({behavior:"smooth",block:"center"});
        document.getElementById("corrige").onclick=()=>{ clearInterval(t); entrada(); };
        document.getElementById("forca").onclick=()=>arranca2();
      } else segue();
    }).catch(segue);
  };
}

function dados(c){ return c.build(rng(semente(ST.ano,ST.eq,c.cod))); }
function cartoes(){ return monta(ST.ano===11?DADOS.a11:DADOS.a10, ST.eq); }
function restam(){ return Math.max(0, MIN_JOGO*60 - Math.floor((Date.now()-ST.ini)/1000)); }

function jogo(){
  const C=cartoes();
  const feitos=Object.keys(ST.feitos).length;
  const ff={}; Object.keys(ST.feitos).forEach(k=>ff[k[0]]=1);
  nav.hidden=false;
  document.getElementById("navt").textContent=ST.nm;
  document.getElementById("navs").textContent="Equipa "+ST.eq+" · "+ST.ano+".º ano";
  app.innerHTML=
   '<div class="hud" id="hud">'+
   '<div><span>Pontos</span><b id="pt">'+ST.pts+'</b></div>'+
   '<div><span>Cartões</span><b>'+feitos+'<span style="font-size:13px;color:var(--fg2)">/16</span></b></div>'+
   '<div><span>Pistas</span><b>'+ST.pistas+'</b></div>'+
   '<div><span>Tempo</span><b id="rel">--:--</b></div></div>'+
   '<div class="fams">'+Object.keys(FAM).map(k=>'<span class="fam'+(ff[k]?' on':'')+'">'+FAM[k].n+(ff[k]?" ✓":"")+'</span>').join("")+'</div>'+
   '<div class="grid" id="grid"></div><div id="slot"></div>'+
   '<div class="row" style="margin-top:20px"><button class="btn quiet" id="term">Terminar e gerar o código</button></div>';
  const g=document.getElementById("grid");
  C.forEach(c=>{
    const b=document.createElement("button");
    b.className="cb"+(ST.feitos[c.cod]?" done":"");
    b.style.setProperty("--fam",FAM[c.f].c);
    b.innerHTML='<span class="f">'+FAM[c.f].n+'</span><h4>'+esc(c.t)+'</h4>'+
      '<span class="meta"><span class="dots">'+'<i></i>'.repeat(c.n)+'</span><span class="pts">'+
      (ST.feitos[c.cod]?"✓ "+ST.feitos[c.cod]:c.p+" pts")+'</span></span>';
    b.onclick=()=>abre(c);
    g.appendChild(b);
  });
  document.getElementById("term").onclick=()=>{ if(confirmarFim()) fim(); };
  tique(); bate();
}
function confirmarFim(){ const s=document.getElementById("slot");
  if(s.dataset.conf==="1") return true;
  s.dataset.conf="1";
  s.innerHTML='<div class="panel"><h3>Terminar?</h3><p>Depois de gerar o código já não podem resolver mais cartões.</p>'+
   '<div class="row"><button class="btn primary" id="sim">Sim, terminar</button><button class="btn" id="nao">Continuar</button></div></div>';
  document.getElementById("slot").scrollIntoView({behavior:"smooth",block:"center"});
  document.getElementById("sim").onclick=()=>fim();
  document.getElementById("nao").onclick=()=>{ s.dataset.conf=""; s.innerHTML=""; };
  return false;
}

let tmr=null;
function tique(){
  if(tmr) clearInterval(tmr);
  const pinta=()=>{ const el=document.getElementById("rel"); if(!el) return;
    const s=restam();
    el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    const h=document.getElementById("hud"); if(h) h.classList.toggle("urgente", s<=300);
    const b=document.getElementById("bar");
    if(b){ b.style.width=(100-100*s/(MIN_JOGO*60)).toFixed(2)+"%"; b.classList.toggle("urg", s<=300); }
    if(s<=0){ clearInterval(tmr); fim(); } };
  pinta(); tmr=setInterval(pinta,1000);
}

function abre(c){
  const d=dados(c), feito=!!ST.feitos[c.cod], slot=document.getElementById("slot");
  slot.dataset.conf="";
  const bloq=ST.err[c.cod+"_ate"]||0, agora=Date.now();

  let h='<div class="panel"><span class="k" style="color:'+FAM[c.f].c+'">'+FAM[c.f].n+' · nível '+c.n+' · '+c.p+' pontos</span>'+
    '<h3>'+esc(c.t)+'</h3><p class="who">Enunciado da equipa '+ST.eq+'</p>';

  const passo = (ST.passo&&ST.passo[c.cod])||0;
  if(d.tipo==="passos"){
    h+='<p>'+esc(d.cen)+'</p>'+
       '<p class="passo">PERGUNTA '+(passo+1)+' DE '+d.passos.length+'</p>'+
       '<p style="font-weight:600">'+esc(d.passos[passo].q)+'</p>';
  } else {
    h+='<p>'+esc(d.sub)+'</p>';
  }
  if(d.cita) h+='<p class="quote">'+esc(d.cita)+'</p>';
  if(d.fml)  h+='<span class="fml">'+esc(d.fml)+'</span>';
  if(d.lista) h+='<ol>'+d.lista.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ol>';
  if(d.pistas) h+='<ol>'+d.pistas.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ol>';

  if(feito){ h+='<p class="msg ok">Resolvido. +'+ST.feitos[c.cod]+' pontos.</p>'; }
  else if(agora<bloq){ h+='<p class="msg bad" id="blo"></p>'; }
  else {
    if(d.tipo==="conta"){
      h+='<div class="itens" id="itens">'+d.itens.map((x,i)=>
        '<button class="item" data-i="'+i+'"><span class="m">?</span><span>'+esc(x)+'</span></button>').join("")+'</div>';
    } else if(d.tipo==="escolha"||d.tipo==="passos"){
      const ops=(d.tipo==="passos")?d.passos[passo].ops:d.ops;
      h+='<div class="opts" id="opts">'+ops.map((x,i)=>
        '<button class="opt" data-i="'+(i+1)+'"><span class="b">'+(i+1)+'</span><span>'+esc(x)+'</span></button>').join("")+'</div>';
    } else if(d.tipo==="tabela"){
      h+='<div id="tabwrap"></div>'+
         '<div class="row" style="margin:0 0 12px">'+
         '<button class="btn" id="maislin">+ linha</button>'+
         '<button class="btn" id="oitolin">+ 8 linhas</button></div>';
    } else if(d.tipo==="salas"){
      const M=d.mapa, N=d.n;
      h+='<div class="salas">';
      for(let i=1;i<=N;i++){
        h+='<div class="sala"><h5>SALA '+i+'</h5><div class="tres">'+
          ['FIL','OBJ','TEM'].map(k=>'<select data-s="'+i+'" data-k="'+k+'"><option value="">—</option>'+
            M[k].map(v=>'<option>'+esc(v)+'</option>').join("")+'</select>').join("")+
          '</div></div>';
      }
      h+='</div><p class="tally">Em que sala está '+esc(d.alvo)+'?</p><div class="escolhe" id="escolhe">'+
        Array.from({length:N},(_,i)=>'<button data-i="'+(i+1)+'">'+(i+1)+'</button>').join("")+'</div>';
    }
    h+='<div style="margin-top:4px"><button class="btn" id="dica">Pedir uma pista (−5 pontos)</button></div>'+
       '<p class="msg" id="m"></p>'+
       '<div class="barra"><span class="lbl" id="lbl"></span>'+
       '<button class="btn primary" id="ok" style="width:auto;flex:0 0 auto" disabled>Validar</button></div>';
  }
  h+='<div style="margin-top:14px"><button class="btn quiet" id="volta">Voltar ao tabuleiro</button></div></div>';
  slot.innerHTML=h;
  ST.ult=c.cod+" · "+c.t; guarda(); envia(false,false);
  document.getElementById("volta").onclick=()=>{ slot.innerHTML=""; window.scrollTo({top:0,behavior:"smooth"}); };
  try{ slot.scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){ slot.scrollIntoView(); }

  if(agora<bloq){
    const el=document.getElementById("blo");
    const txt=s=>"Duas respostas erradas. Este cartão volta a abrir dentro de "+s+" s — aproveitem para rever o raciocínio.";
    if(el) el.textContent=txt(Math.ceil((bloq-agora)/1000));
    const tb=setInterval(()=>{ const s=Math.ceil((bloq-Date.now())/1000);
      if(s<=0){ clearInterval(tb); abre(c); }
      else { const e2=document.getElementById("blo"); if(e2) e2.textContent=txt(s); } },250);
    return;
  }
  if(feito) return;

  const m=document.getElementById("m"), ok=document.getElementById("ok"), lbl=document.getElementById("lbl");
  let marcas=[], sel=0, linhas=[], naux=0;

  function estado(){
    if(d.tipo==="conta"){
      const feitos=marcas.filter(x=>x).length, sim=marcas.filter(x=>x===1).length;
      lbl.innerHTML=feitos<d.itens.length
        ? '<b>'+feitos+'/'+d.itens.length+'</b> marcados'
        : 'Resposta: <b>'+sim+'</b>';
      ok.disabled = feitos<d.itens.length;
      return sim;
    }
    if(d.tipo==="tabela"){
      const n=linhas.length;
      const cheias=linhas.filter(L=>L.c.every(x=>x)&&L.ops.every(x=>x)).length;
      lbl.innerHTML='<b>'+cheias+'/'+(n||0)+'</b> linhas completas';
      ok.disabled = !(n>0 && cheias===n);
      return null;
    }
    lbl.innerHTML = sel ? 'Opção <b>'+sel+'</b>' : 'Escolham uma opção';
    ok.disabled = !sel;
    return sel;
  }
  const NOPS=(d.toks||[]).filter(x=>x.k==="o").length;
  function novaLin(){ return {c:[0,0,0],ops:new Array(NOPS).fill(0)}; }
  function sim(v){ return v===1?"V":v===2?"F":"?"; }
  function cls(v){ return v===1?"v":v===2?"f":""; }
  function desenhaTab(){
    const w=document.getElementById("tabwrap"); if(!w) return;
    if(!linhas.length){
      w.innerHTML='<p class="tally">A tabela está vazia. Comecem por acrescentar linhas.</p>';
      estado(); return;
    }
    let cab='<tr><th class="fx">P</th><th class="fx">Q</th><th class="fx">R</th>';
    let io=0;
    d.toks.forEach((t,z)=>{
      if(t.k==="p") cab+='<th class="par">'+t.s+'</th>';
      else if(t.k==="v") cab+='<th class="var">'+t.s+'</th>';
      else { cab+='<th class="op'+(z===d.im?' prin':'')+'">'+t.s+'</th>'; io++; }
    });
    cab+='<th class="fx2"></th></tr>';
    let corpo='';
    linhas.forEach((L,i)=>{
      corpo+='<tr>';
      for(let c=0;c<3;c++)
        corpo+='<td class="fx"><button data-r="'+i+'" data-k="c" data-c="'+c+'" class="'+cls(L.c[c])+'">'+sim(L.c[c])+'</button></td>';
      let j=0;
      d.toks.forEach((t,z)=>{
        if(t.k==="p"){ corpo+='<td class="par"></td>'; return; }
        if(t.k==="v"){ const v=L.c["PQR".indexOf(t.s)];
          corpo+='<td class="var">'+(v?sim(v):"")+'</td>'; return; }
        corpo+='<td class="op'+(z===d.im?' prin':'')+'"><button data-r="'+i+'" data-k="o" data-c="'+j+'" class="'+cls(L.ops[j])+'">'+sim(L.ops[j])+'</button></td>';
        j++;
      });
      corpo+='<td class="fx2"><button class="rm" data-rm="'+i+'">✕</button></td></tr>';
    });
    w.innerHTML='<div class="ttwrap"><table class="tt2"><thead>'+cab+'</thead><tbody>'+corpo+'</tbody></table></div>';
    w.querySelectorAll("button[data-k]").forEach(bt=>{
      bt.onclick=()=>{ const i=+bt.dataset.r, k=bt.dataset.k, c=+bt.dataset.c, L=linhas[i];
        const novo=(((k==="c"?L.c[c]:L.ops[c])||0)+1)%3;
        if(k==="c"){ L.c[c]=novo; desenhaTab(); return; }
        L.ops[c]=novo; bt.className=cls(novo); bt.textContent=sim(novo); estado(); };
    });
    w.querySelectorAll("button[data-rm]").forEach(bt=>{
      bt.onclick=()=>{ linhas.splice(+bt.dataset.rm,1); desenhaTab(); };
    });
    estado();
  }

  estado();

  if(d.tipo==="conta"){
    document.querySelectorAll("#itens .item").forEach(b=>{
      b.onclick=()=>{ const i=+b.dataset.i; marcas[i]=((marcas[i]||0)+1)%3;
        b.className="item"+(marcas[i]===1?" sim":marcas[i]===2?" nao":"");
        b.querySelector(".m").textContent=marcas[i]===1?"✓":marcas[i]===2?"✗":"?";
        estado(); };
    });
  } else if(d.tipo==="escolha"||d.tipo==="passos"){
    document.querySelectorAll("#opts .opt").forEach(b=>{
      b.onclick=()=>{ sel=+b.dataset.i;
        document.querySelectorAll("#opts .opt").forEach(x=>x.classList.toggle("sel",x===b));
        estado(); };
    });
  } else if(d.tipo==="tabela"){
    desenhaTab();
    document.getElementById("maislin").onclick=()=>{
      if(linhas.length>=12){ m.className="msg warn"; m.textContent="Doze linhas já é mais do que o preciso."; return; }
      linhas.push(novaLin()); desenhaTab(); };
    document.getElementById("oitolin").onclick=()=>{
      while(linhas.length<8) linhas.push(novaLin()); desenhaTab(); };
  } else if(d.tipo==="salas"){
    document.querySelectorAll("#escolhe button").forEach(b=>{
      b.onclick=()=>{ sel=+b.dataset.i;
        document.querySelectorAll("#escolhe button").forEach(x=>x.classList.toggle("on",x===b));
        estado(); };
    });
  }

  document.getElementById("dica").onclick=function(){
    ST.pistas++; ST.pts=Math.max(0,ST.pts-5); this.disabled=true; guarda();
    const pt=document.getElementById("pt"); if(pt) pt.textContent=ST.pts;
    m.className="msg warn"; m.textContent="Pista: "+d.dica+"  (−5 pontos)"; envia(true,false);
  };

  function acerta(){
    ST.feitos[c.cod]=c.p; ST.pts+=c.p; guarda(); envia(true,false);
    m.className="msg ok"; m.textContent="Certo. +"+c.p+" pontos.";
    setTimeout(()=>{ jogo(); window.scrollTo({top:0,behavior:"smooth"}); },700);
  }
  function erra(){
    const k=c.cod; ST.err[k]=(ST.err[k]||0)+1;
    if(ST.err[k]%2===0){
      ST.err[k+"_ate"]=Date.now()+45000;
      if(ST.err[k]>=4){ ST.pts=Math.max(0,ST.pts-5); }
      guarda(); abre(c); return true;
    }
    guarda(); return false;
  }
  ok.onclick=()=>{
    if(d.tipo==="tabela"){
      const n=linhas.length;
      if(n!==8){ m.className="msg warn";
        m.textContent="A tabela tem "+n+(n===1?" linha":" linhas")+". Com três proposições simples, quantas combinações de V e F existem?"; return; }
      const chaves=new Set(linhas.map(L=>L.c.join("")));
      if(chaves.size!==8){ m.className="msg warn";
        m.textContent="Há combinações de P, Q e R repetidas. Cada uma deve aparecer uma só vez."; return; }
      const ops=d.toks.filter(x=>x.k==="o");
      let mal=0, malPrin=0;
      const iPrin=d.toks.slice(0,d.im).filter(x=>x.k==="o").length;
      linhas.forEach(L=>{ const i=(L.c[0]===1?0:4)+(L.c[1]===1?0:2)+(L.c[2]===1?0:1);
        L.ops.forEach((v,j)=>{ if((v===1)!==ops[j].vec[i]){ mal++; if(j===iPrin) malPrin++; } }); });
      if(mal===0){ acerta(); }
      else if(!erra()){ m.className="msg bad";
        m.textContent="Há "+mal+(mal===1?" célula errada":" células erradas")+" na tabela"+
          (malPrin?(malPrin===mal?" — na coluna do conectivo principal":", "+malPrin+" na coluna do conectivo principal"):"")+
          ". Mais uma errada e o cartão fecha 45 segundos."; }
      return;
    }
    const v=estado();
    const alvo=(d.tipo==="passos")?d.passos[passo].resp:d.resp;
    if(v===alvo){
      if(d.tipo==="passos" && passo+1<d.passos.length){
        if(!ST.passo) ST.passo={};
        ST.passo[c.cod]=passo+1; guarda();
        m.className="msg ok"; m.textContent="Certo. Falta a segunda pergunta.";
        setTimeout(()=>abre(c),700);
        return;
      }
      ST.feitos[c.cod]=c.p; ST.pts+=c.p; guarda(); envia(true,false);
      m.className="msg ok"; m.textContent="Certo. +"+c.p+" pontos.";
      setTimeout(()=>{ jogo(); window.scrollTo({top:0,behavior:"smooth"}); },700);
    } else {
      const k=c.cod; ST.err[k]=(ST.err[k]||0)+1;
      if(ST.err[k]%2===0){
        ST.err[k+"_ate"]=Date.now()+45000;
        if(ST.err[k]>=4){ ST.pts=Math.max(0,ST.pts-5); }
        guarda(); abre(c);
      } else {
        guarda(); m.className="msg bad";
        m.textContent="Não é isso. Mais uma errada e o cartão fecha 45 segundos.";
      }
    }
  };
}

function fim(){
  if(tmr) clearInterval(tmr);
  const feitos=Object.keys(ST.feitos).length;
  const mins=Math.min(63,Math.round((Date.now()-ST.ini)/60000));
  const cod=fazCodigo(ST.ano,ST.eq,ST.pts,feitos,mins);
  ST.fim=cod; guarda(); envia(true,false); if(_bat) clearInterval(_bat); mostraFim(cod,feitos,mins);
}
function mostraFim(cod,feitos,mins){
  nav.hidden=false;
  document.getElementById("navt").textContent=ST.nm;
  document.getElementById("navs").textContent="Equipa "+ST.eq+" · terminado";
  const b=document.getElementById("bar"); if(b){ b.style.width="100%"; }
  app.innerHTML='<h1>Acabou</h1>'+
   '<p class="sub">Mostrem este código ao professor. É nele que vão os vossos pontos.</p>'+
   '<div class="fim"><span class="k">Equipa '+esc(ST.eq)+' · '+esc(ST.nm)+'</span>'+
   '<div class="codigo">'+cod+'</div></div>'+
   '<div class="hud" style="margin-top:14px">'+
   '<div><span>Pontos</span><b>'+ST.pts+'</b></div>'+
   '<div><span>Cartões</span><b>'+feitos+'<span style="font-size:13px;color:var(--fg2)">/16</span></b></div>'+
   '<div><span>Pistas</span><b>'+ST.pistas+'</b></div>'+
   '<div><span>Minutos</span><b>'+mins+'</b></div></div>'+
   '<p class="sub" style="margin-top:16px">Não fechem esta página até o código ser registado.</p>';
}

/* ---------- arranque ---------- */
function arranca(){
  const s=carrega();
  if(s&&s.ini&&!s.fim&&(Date.now()-s.ini)<MIN_JOGO*60000+600000){ ST=s; jogo(); return; }
  if(s&&s.fim){ ST=s;
    mostraFim(s.fim,Object.keys(s.feitos||{}).length,Math.min(63,Math.round(((s.ini?Date.now()-s.ini:0))/60000)));
    const d=document.createElement("div"); d.className="row"; d.style.marginTop="18px";
    d.innerHTML='<button class="btn quiet" id="novo">Começar de novo</button>';
    app.appendChild(d);
    document.getElementById("novo").onclick=()=>{ try{localStorage.removeItem("mpa");}catch(e){} entrada(); };
    return; }
  entrada();
}
arranca();
</script>
